name: Core live deployment verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/core-live-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  staging:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the four private product entrypoints
        run: |
          curl -fsS --max-time 60 https://jenlow-core-stage-check.jenlow-production.workers.dev/health > /tmp/core.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/core.json'))
          print(d)
          assert d['ok'] and len(d['checks'])==28
          assert all(x['ok'] for x in d['checks'])
          PY
  network:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Network production identity baseline
        run: |
          python - <<'PY'
          import json,subprocess
          base='https://api-network.jenlow.net'
          def check(path,expected,method='GET',headers=()):
            args=['curl','-sS','--max-time','25','-o','/tmp/core-response','-w','%{http_code}','-X',method]
            for h in headers: args+=['-H',h]
            code=int(subprocess.check_output(args+[base+path]))
            print(method,path,code)
            assert code==expected
            return json.load(open('/tmp/core-response')) if code!=204 else {}
          assert check('/health',200)['security']=='bound'
          assert check('/api/health/ready',200)['status']=='ready'
          check('/core/identity',401)
          check('/core/identity',401,headers=['Authorization: Bearer forged','X-Product: tools','X-User-Id: forged'])
          check('/core/auth/supabase/exchange',401,'POST')
          check('/core/session/activity',401,'POST')
          check('/core/session/revoke',401,'POST')
          check('/tools/projects',404)
          check('/core/identity',403,headers=['Origin: https://untrusted.example'])
          check('/core/identity',204,'OPTIONS',['Origin: https://network.jenlow.net','Access-Control-Request-Method: GET'])
          PY
