name: Core security validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle:check
      - name: Validate retired OCR/OMR bridge in isolation
        run: node --test ../services/music-engine/test/scan-worker.test.mjs
      - name: Record verified release bundle for controlled deployment
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const bytes=fs.readFileSync('dist/worker.check.js');
          console.log('CORE_BUNDLE_SHA256 '+crypto.createHash('sha256').update(bytes).digest('hex'));
          const b64=bytes.toString('base64');
          for(let i=0;i<b64.length;i+=3000)console.log('CORE_BUNDLE '+b64.slice(i,i+3000));
          JS
