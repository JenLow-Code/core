name: Music OMR Python validation
on:
  push:
    paths:
      - 'services/music-engine/omr-service/**'
      - '.github/workflows/music-omr-validation.yml'
  pull_request:
    paths:
      - 'services/music-engine/omr-service/**'
      - '.github/workflows/music-omr-validation.yml'
jobs:
  validate:
    name: Validate MusicXML timing and separated staves
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/music-engine/omr-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OMR service dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Python unit tests (synthetic score)
        run: python -m pytest -q tests
      - name: Verify Dockerfile references pinned Audiveris
        run: |
          grep -q 'AUDIVERIS_VERSION=5.11.0' Dockerfile
          grep -q 'sha256sum -c' Dockerfile
  image-build:
    name: Build Audiveris Docker runtime and verify executable
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned Python and Audiveris 5.11.0 image
        run: docker build --pull --file services/music-engine/omr-service/Dockerfile --tag jenlow-omr:ci services/music-engine/omr-service
      - name: Verify real Audiveris CLI can start headlessly
        timeout-minutes: 2
        run: |
          trap 'docker rm -f jenlow-omr-cli >/dev/null 2>&1 || true' EXIT
          timeout -k 10s 75s docker run --name jenlow-omr-cli --rm jenlow-omr:ci xvfb-run -a /opt/audiveris/bin/Audiveris -batch -help
      - name: Verify HTTP backend health
        timeout-minutes: 3
        run: |
          trap 'docker rm -f omr-service-test >/dev/null 2>&1 || true' EXIT
          docker run -d --rm --name omr-service-test -e OMR_API_SECRET=unit-test-secret-must-be-at-least-32-chars -p 127.0.0.1:8000:8000 jenlow-omr:ci
          for attempt in $(seq 1 18); do
            if curl -fsS http://127.0.0.1:8000/health | grep -q '"available":true'; then
              docker stop omr-service-test
              exit 0
            fi
            sleep 2
          done
          docker logs omr-service-test
          docker stop omr-service-test
          exit 1
